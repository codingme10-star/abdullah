<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام الذكي - ليلة النجوم</title>
    
    <!-- استدعاء خطوط جوجل -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 25px 15px; font-family: 'Cairo', sans-serif;
            background: #030b1e url('https://i.pinimg.com/originals/20/52/30/2052301f8dd32b0d48a802e0674441c4.jpg') no-repeat center center fixed;
            background-size: cover; color: #ffffff; display: flex;
            flex-direction: column; align-items: center; min-height: 100vh;
        }

        .main-title {
            width: 100%; max-width: 1000px; text-align: center; color: #ffe67b;
            font-size: 2.2rem; font-weight: 900; margin-bottom: 20px;
            background: rgba(3, 15, 38, 0.85); padding: 15px; border-radius: 20px;
            border: 2px solid #ffb700; backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(255, 183, 0, 0.4);
        }

        .tools-grid {
            width: 100%; max-width: 1000px; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; margin-bottom: 30px;
        }

        .widget-box {
            background: rgba(4, 20, 48, 0.88); border: 2px solid #ffaa00;
            border-radius: 20px; padding: 20px; text-align: center;
            backdrop-filter: blur(8px); box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .widget-title { margin: 0 0 12px 0; color: #ffe67b; font-size: 1.2rem; font-weight: 700; }

        .digital-number {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
            color: #ffe67b; text-shadow: 0 0 12px #ffaa00; direction: ltr; margin: 10px 0;
        }

        .btn-small {
            background: linear-gradient(45deg, #ff9900, #ffe67b); color: #030b1e;
            border: none; padding: 8px 15px; font-size: 0.95rem; font-weight: 900;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease; margin: 3px;
        }
        .btn-small:hover { transform: scale(1.05); }
        .btn-danger { background: linear-gradient(45deg, #ff3333, #ff6666); color: #fff; }
        .btn-voice { background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        .timer-controls input, .trans-controls select {
            padding: 8px; background: rgba(2, 9, 23, 0.9); border: 1px solid #ffaa00;
            border-radius: 8px; color: #ffe67b; font-family: 'Cairo', sans-serif; font-size: 0.9rem;
            outline: none; text-align: center; margin-bottom: 10px;
        }

        .trans-textarea {
            width: 100%; height: 60px; background: rgba(2, 9, 23, 0.8);
            border: 1px solid #ffaa00; border-radius: 10px; color: #fff;
            padding: 10px; font-family: 'Cairo', sans-serif; font-size: 0.9rem;
            resize: none; outline: none; margin-bottom: 10px;
        }

        .file-preview-area {
            width: 100%; height: 250px; margin-top: 15px; border-radius: 12px;
            border: 1px dashed #ffaa00; display: flex; justify-content: center;
            align-items: center; overflow: hidden; background: rgba(2, 9, 23, 0.6); position: relative;
        }
        .file-preview-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .file-preview-area iframe { width: 100%; height: 100%; border: none; }
        
        .sync-status { font-size: 0.85rem; color: #00ffaa; margin-bottom: 10px; font-weight: bold; }
        .sync-status.offline { color: #ffaa00; }

        /* قسم المهام */
        .input-section {
            width: 100%; max-width: 1000px; background: rgba(4, 20, 48, 0.88);
            border: 2px solid #ffaa00; border-radius: 20px; padding: 20px;
            margin-bottom: 30px; backdrop-filter: blur(6px);
        }

        .input-section h2 { margin-top: 0; color: #ffe67b; font-size: 1.2rem; }
        .tasks-textarea {
            width: 100%; height: 130px; background: rgba(2, 9, 23, 0.8);
            border: 1px solid #ffaa00; border-radius: 12px; color: #fff;
            padding: 15px; font-family: 'Cairo', sans-serif; font-size: 0.95rem; resize: vertical; outline: none;
        }
        .btn-action {
            background: linear-gradient(45deg, #ff9900, #ffe67b); color: #030b1e;
            border: none; padding: 12px 20px; font-size: 1rem; font-weight: 900;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4); margin-top: 15px; width: 48%;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-clear { background: linear-gradient(45deg, #ff3333, #ff6666); color: #fff; }

        .tasks-grid { width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; }
        .task-card {
            background: linear-gradient(135deg, rgba(4, 20, 48, 0.88), rgba(8, 30, 68, 0.82));
            border: 2px solid #ffaa00; border-radius: 24px; padding: 22px; width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; cursor: pointer; transition: all 0.4s ease;
        }
        .task-card:hover { transform: translateY(-5px); border-color: #ffe67b; }
        .task-card h3 { color: #ffe67b; border-bottom: 2px dashed rgba(255,230,123,0.3); padding-bottom: 12px; margin-top: 0; }
        .task-list { list-style: none; padding: 0; margin: 10px 0 0 0; line-height: 1.8; color: #e2f1ff; font-weight: bold; }
        .checkmark-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 15, 38, 0.93); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.4s;
        }
        .task-card.completed .checkmark-overlay { opacity: 1; visibility: visible; }
        .checkmark { font-size: 80px; color: #ffe67b; }
    </style>

    <!-- مكاتب Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <h1 class="main-title">🌌 منظم المهام الذكي - ليلة النجوم 🌌</h1>

    <div class="tools-grid">
        <!-- 1. الساعة -->
        <div class="widget-box">
            <div class="widget-title">🕒 الساعة الآن</div>
            <div class="digital-number" id="clockDisplay">00:00:00</div>
        </div>

        <!-- 2. المؤقت -->
        <div class="widget-box">
            <div class="widget-title">⏳ المؤقت (التايمر)</div>
            <div class="digital-number" id="timerDisplay">00:00</div>
            <div class="timer-controls">
                <input type="number" id="timerMinutes" placeholder="دقائق" min="1" value="25" style="width:80px;">
                <br>
                <button class="btn-small" onclick="startTimer()">▶ ابدأ</button>
                <button class="btn-small btn-danger" onclick="pauseTimer()">⏸ إيقاف</button>
                <button class="btn-small" style="background:#aaa;" onclick="resetTimer()">🔄 إعادة</button>
            </div>
        </div>

        <!-- 3. المترجم مع النطق الصوتي -->
        <div class="widget-box">
            <div class="widget-title">🌐 المترجم الفوري الصوتي</div>
            <textarea class="trans-textarea" id="transInput" placeholder="اكتب النص هنا..."></textarea>
            <textarea class="trans-textarea" id="transOutput" placeholder="الترجمة ستظهر هنا..." readonly style="background: rgba(2,9,23,0.95); color: #ffe67b; border-style: dashed;"></textarea>
            <div class="trans-controls">
                <select id="transDirection">
                    <option value="ar|en">عربي ➔ إنجليزي</option>
                    <option value="en|ar">إنجليزي ➔ عربي</option>
                </select>
                <br>
                <button class="btn-small" onclick="translateText()">ترجم ✨</button>
                <!-- الزر الجديد الخاص بالنطق -->
                <button class="btn-small btn-voice" onclick="speakEnglishText()">🔊 انطق الإنجليزي</button>
            </div>
        </div>

        <!-- 4. حفظ ومزامنة الملفات (السحابة) -->
        <div class="widget-box">
            <div class="widget-title">📑 صندوق المزامنة السحابي (PDF/صور)</div>
            <div id="syncStatus" class="sync-status offline">بانتظار إدخال بيانات Firebase...</div>
            <input type="file" id="fileInput" accept="image/*,.pdf" style="display: none;" onchange="handleFileUpload(event)">
            <div>
                <button class="btn-small" onclick="document.getElementById('fileInput').click()">📤 رفع ملف للسحابة</button>
                <button class="btn-small btn-danger" onclick="deleteFile()">🗑️ حذف من السحابة</button>
            </div>
            <div class="file-preview-area" id="filePreviewContainer">
                <span style="color: #aaa; font-size: 0.9rem;">لا يوجد ملف محفوظ</span>
            </div>
        </div>
    </div>

    <!-- 5. قسم المهام -->
    <div class="input-section">
        <h2>أضف نص المهام الكامل هنا:</h2>
        <textarea id="rawTaskText" class="tasks-textarea" placeholder="انسخ والصق المهام هنا..."></textarea>
        <div style="display: flex; justify-content: space-between; gap: 15px;">
            <button class="btn-action" onclick="generateSchedule()">✨ حفظ وترتيب الجدول ✨</button>
            <button class="btn-action btn-clear" onclick="clearAll()">🗑️ مسح الكل</button>
        </div>
    </div>
    <div class="tasks-grid" id="tasksContainer"></div>

    <script>
        // ==================== 1. الساعة (تأخير ساعة) ====================
        function updateClock() {
            const now = new Date();
            now.setHours(now.getHours() - 1); // تأخير الساعة بمقدار ساعة كما طلبت
            let hours = now.getHours(); let minutes = now.getMinutes(); let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('clockDisplay').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // ==================== 2. المؤقت ====================
        let timerInterval = null; let timerSecondsLeft = 0;
        function startTimer() {
            if (timerInterval) return;
            if (timerSecondsLeft === 0) {
                const mins = parseInt(document.getElementById('timerMinutes').value);
                if (isNaN(mins) || mins <= 0) return alert('أدخل وقت صحيح!');
                timerSecondsLeft = mins * 60;
            }
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerSecondsLeft--; updateTimerDisplay();
                if (timerSecondsLeft <= 0) { clearInterval(timerInterval); timerInterval = null; alert('🔔 انتهى الوقت بنجاح!'); }
            }, 1000);
        }
        function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
        function resetTimer() { pauseTimer(); timerSecondsLeft = 0; document.getElementById('timerDisplay').innerText = "00:00"; }
        function updateTimerDisplay() {
            let m = Math.floor(timerSecondsLeft / 60); let s = timerSecondsLeft % 60;
            m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        // ==================== 3. الترجمة + النطق الصوتي ====================
        async function translateText() {
            const input = document.getElementById('transInput').value.trim();
            const langpair = document.getElementById('transDirection').value;
            const output = document.getElementById('transOutput');
            if (!input) return alert('اكتب نص أولاً!');
            output.value = "جاري الترجمة... ⏳";
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=${langpair}`);
                const data = await res.json();
                output.value = data.responseData ? data.responseData.translatedText : "عذراً، حدث خطأ.";
            } catch (err) { output.value = "لا يوجد اتصال بالإنترنت."; }
        }

        // دالة نطق النص الإنجليزي (الجديدة)
        function speakEnglishText() {
            const direction = document.getElementById('transDirection').value;
            const inputTxt = document.getElementById('transInput').value.trim();
            const outputTxt = document.getElementById('transOutput').value.trim();
            
            // تحديد أي صندوق يحتوي على اللغة الإنجليزية
            let textToRead = (direction === 'ar|en') ? outputTxt : inputTxt;

            if (!textToRead || textToRead.includes("جاري الترجمة") || textToRead.includes("خطأ")) {
                alert("لا توجد كلمات إنجليزية لنطقها!");
                return;
            }

            // إعداد القارئ الصوتي
            const speech = new SpeechSynthesisUtterance(textToRead);
            speech.lang = 'en-US'; // تعيين اللغة للإنجليزية
            speech.rate = 0.85; // إبطاء الصوت قليلاً ليكون النطق واضحاً للمذاكرة
            speech.pitch = 1;
            
            // تشغيل الصوت
            window.speechSynthesis.speak(speech);
        }

        // ==================== 4. مزامنة الملفات (Firebase) ====================
        const firebaseConfig = {
            apiKey: "ضع_المفتاح_هنا",
            authDomain: "ضع_الدومين_هنا",
            databaseURL: "ضع_رابط_قاعدة_البيانات_هنا",
            projectId: "ضع_المعرف_هنا",
            storageBucket: "ضع_رابط_التخزين_هنا",
            messagingSenderId: "ضع_رقم_المرسل_هنا",
            appId: "ضع_الـAppID_هنا"
        };

        let isCloudEnabled = firebaseConfig.apiKey !== "
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDpSoVPtWXW-JhzPdLRRggxWrztnqtO_CE",
  authDomain: "coding-me-do.firebaseapp.com",
  projectId: "coding-me-do",
  storageBucket: "coding-me-do.firebasestorage.app",
  messagingSenderId: "650309039200",
  appId: "1:650309039200:web:5391b7a086e64314ea3f05",
  measurementId: "G-0KHC4RDHDB"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app); ";
        let dbRef, storageRef;

        if (isCloudEnabled) {
            firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database().ref('shared_file');
            storageRef = firebase.storage().ref('uploads/study_file');

            document.getElementById('syncStatus').innerText = "🟢 متصل بالسحابة (الملفات ستظهر في التابلت)";
            document.getElementById('syncStatus').className = "sync-status";

            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.url) displayFilePreview(data.url, data.type);
                else document.getElementById('filePreviewContainer').innerHTML = '<span style="color:#aaa;">لا يوجد ملف محفوظ</span>';
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('filePreviewContainer').innerHTML = '<span style="color:#ffe67b;">جاري الرفع للسحابة... ⏳</span>';

            if (isCloudEnabled) {
                storageRef.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
                    dbRef.set({ name: file.name, type: file.type, url: url });
                });
            } else {
                alert("يرجى إدخال بيانات Firebase في الكود أولاً لتعمل المزامنة السحابية!");
                document.getElementById('filePreviewContainer').innerHTML = '<span style="color:#aaa;">فشل الرفع لعدم وجود إعدادات السحابة</span>';
            }
        }

        function displayFilePreview(url, type) {
            const container = document.getElementById('filePreviewContainer');
            if (type.startsWith('image/')) container.innerHTML = `<img src="${url}">`;
            else if (type === 'application/pdf') container.innerHTML = `<iframe src="${url}"></iframe>`;
            else container.innerHTML = `<span style="color:#ffe67b">تم رفع الملف بنجاح.</span>`;
        }

        function deleteFile() {
            if (isCloudEnabled && confirm("حذف الملف من السحابة (من جميع الأجهزة)؟")) {
                dbRef.remove();
                storageRef.delete().catch(()=>console.log("الملف غير موجود في Storage"));
            }
        }

        // ==================== 5. نظام المهام ====================
        window.onload = () => {
            const savedText = localStorage.getItem('starryTasks');
            if (savedText) {
                document.getElementById('rawTaskText').value = savedText;
                generateSchedule(false);
            }
        };

        function generateSchedule(isManual = true) {
            const rawText = document.getElementById('rawTaskText').value.trim();
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            if (!rawText) { if(isManual) alert('الرجاء إدخال المهام!'); return; }
            localStorage.setItem('starryTasks', rawText);

            const lines = rawText.split('\n');
            let currentCard = null; let cardsData = [];
            lines.forEach(line => {
                let txt = line.trim();
                if (!txt) return;
                const isSubTask = /^([👨🏻‍💻📚🚀⚡]|\s*-(?!\s))/i.test(txt) || txt.startsWith('الجديد:') || txt.startsWith('التراكمات:');
                if (!isSubTask) {
                    if (currentCard) cardsData.push(currentCard);
                    currentCard = { title: txt, items: [] };
                } else {
                    if (!currentCard) currentCard = { title: 'المهام', items: [] };
                    currentCard.items.push(txt);
                }
            });
            if (currentCard) cardsData.push(currentCard);

            let completedCards = JSON.parse(localStorage.getItem('completedCardsStarry')) || [];

            cardsData.forEach(card => {
                const div = document.createElement('div');
                div.className = 'task-card'; div.dataset.title = card.title;
                if (completedCards.includes(card.title)) div.classList.add('completed');
                
                div.onclick = () => {
                    div.classList.toggle('completed');
                    let comps = JSON.parse(localStorage.getItem('completedCardsStarry')) || [];
                    if (div.classList.contains('completed')) {
                        if (!comps.includes(card.title)) comps.push(card.title);
                    } else { comps = comps.filter(t => t !== card.title); }
                    localStorage.setItem('completedCardsStarry', JSON.stringify(comps));
                };

                div.innerHTML = `
                    <div class="checkmark-overlay"><div class="checkmark">✔</div></div>
                    <h3>${card.title}</h3>
                    <ul class="task-list">${card.items.map(i => `<li>${i}</li>`).join('')}</ul>
                `;
                container.appendChild(div);
            });
        }

        function clearAll() {
            if (confirm('مسح كل المهام؟')) {
                localStorage.removeItem('starryTasks'); localStorage.removeItem('completedCardsStarry');
                document.getElementById('rawTaskText').value = ''; document.getElementById('tasksContainer').innerHTML = '';
            }
        }
    </script>
</body>
</html>
